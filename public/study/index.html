<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Study materials, practice questions, and review notes.">
  <title>Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Caslon+Text:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/study/styles.css">
  <link rel="stylesheet" href="/study/hub.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <script type="module" src="/study/app.js"></script>
</head>
<body>
  <div class="page-tools"><span id="connection-label" class="connection-label"></span><button class="text-button" id="settings-button">Settings</button></div>
  <main id="main"></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog" class="dialog-header"><h2 id="settings-title">Settings</h2><button aria-label="Close settings" class="icon-button">×</button></form>
    <p id="settings-status" class="muted"></p>
    <div id="access-settings"><label class="field-label" for="access-code">Study access code</label>
    <input type="password" id="access-code" autocomplete="off" placeholder="Access code">
    <p class="field-help">Required if AI access is protected.</p>
    <button id="save-settings" class="button primary">Save</button></div>
    <div class="settings-divider"></div>
    <p class="small muted">Progress is saved in this browser. Uploaded files are processed by AI and aren’t stored by this app.</p>
    <button id="download-session" class="button secondary">Download backup <span>↓</span></button>
    <button id="restore-session" class="text-button full-width">Restore backup</button>
    <input type="file" id="backup-input" accept="application/json,.json" hidden>
    <button id="clear-progress" class="text-button danger full-width">Clear progress</button>
  </dialog>
</body>
</html>

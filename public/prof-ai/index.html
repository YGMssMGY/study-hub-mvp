<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prof. AI · Study Hub</title>
<meta name="description" content="Chat with an AI tutor built from your ECON 351x professor's slides and practice sets, or take a quick quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/prof-ai/styles.css">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="/prof-ai/app.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="lockup" href="/">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 2h15l8 8v15a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5z" fill="#fff"/><path d="M22 2l8 8h-5a3 3 0 0 1-3-3z" fill="#FFCC00"/><rect x="8" y="12" width="15" height="2.6" rx="1.3" fill="#990000"/><rect x="8" y="17" width="12" height="2.6" rx="1.3" fill="#990000"/><rect x="8" y="22" width="8" height="2.6" rx="1.3" fill="#990000"/></svg>
      <span class="word">Study Hub</span>
    </a>
    <div class="pick" id="pickWrap">
      <button class="pick-btn" id="pickBtn" aria-haspopup="listbox" aria-expanded="false"></button>
      <div class="menu" id="menu" role="listbox"></div>
    </div>
    <div class="spacer"></div>
    <div class="tabs"><button id="tabChat" class="on">Chat</button><button id="tabQuiz">Quiz</button></div>
  </header>

  <main class="feed" id="feed"><div class="inner" id="inner"></div></main>

  <div class="composer" id="composer">
    <div class="files" id="files"></div>
    <div class="box" id="drop">
      <button class="clip" id="pick" title="Attach slides or notes" aria-label="Attach files">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
      </button>
      <input type="file" id="fileIn" multiple accept=".pdf,.pptx,.docx,.txt,.md,.csv" hidden>
      <textarea id="q" rows="1" placeholder="Message…" aria-label="Message"></textarea>
      <button class="send" id="send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
      </button>
    </div>
    <div class="under">
      <button class="toggle on" id="stepTgl" title="Show math one step at a time" aria-pressed="true"><span class="sw"></span>Step-by-step</button>
      <span>Cites course files · can make mistakes</span>
    </div>
  </div>
</div>
</body>
</html>
